[package]
name = "dual-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "dual-core"
path = "src/main.rs"
test = false
bench = false

[dependencies]
embedded-hal = "1"
rp1-hal = { path = "../../rp1-hal" }
rp1-rt = { path = "../../rp1-rt" }
rp1-proto = { path = "../../rp1-proto" }

[build-dependencies]
rp1-build = { path = "../../rp1-build" }

[package.metadata.rp1]
schema = 2
board = "rpi-cm5"
clock = { authority = "rp1", clk_sys_hz = 200000000 }
log = { sink = "uart0", baudrate = 115200 }

[package.metadata.rp1.proc0]
gpio = [8, 22] # 8 = SPI0 chip select driven as GPIO
timer = ["ALARM0"]
spi0 = { sck = 11, mosi = 10, miso = 9 }

[package.metadata.rp1.proc1]
gpio = [27]
gpio_irq = [27]
timer = ["ALARM1"]
adc = {}
i2c1 = { sda = 2, scl = 3 }
