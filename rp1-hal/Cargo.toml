[package]
name = "rp1-hal"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
pio-asm = ["dep:pio"]
eh02 = ["eh02-adc"]
eh-nb = ["dep:embedded-hal-nb", "dep:nb"]
embedded-io-07 = ["dep:embedded-io-07"]
eh02-adc = ["dep:embedded-hal-0-2", "dep:nb"]
# DMA ring producer's `SlotCopy` adapter on `dma::Channel`. Unstable: the DMA
# ordering chain is a hypothesis and the last hardware campaign failed (docs/dma.md).
unstable-ring-dma = ["rp1-proto/unstable-ring-dma"]

[dependencies]
pio-core = { version = "0.3", default-features = false }
pio = { version = "0.3", default-features = false, optional = true }
rp1-pac = { path = "../rp1-pac" }
# The application picks the critical-section implementation (rp1-rt's default feature or its
# own), so this crate must not switch the default on.
rp1-rt = { path = "../rp1-rt", default-features = false }
rp1-proto = { path = "../rp1-proto" }
embedded-hal = "1"
fugit = { version = "0.3.9", default-features = false }
embedded-hal-0-2 = { package = "embedded-hal", version = "0.2.7", features = ["unproven"], optional = true }
nb = { version = "1", optional = true }
embedded-io = "0.6"
embedded-io-07 = { package = "embedded-io", version = "0.7.1", optional = true }
embedded-hal-nb = { version = "1", optional = true }

[dev-dependencies]
critical-section = { version = "1", features = ["std"] }
pio = { version = "0.3", default-features = false }
trybuild = "1"
