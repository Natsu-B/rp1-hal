[package]
name = "rp1-hal"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# DMA ring producer's `SlotCopy` implementation for `dma::Channel`. Unstable: the DMA
# ordering chain is a hypothesis and the last hardware campaign failed (docs/dma.md).
unstable-ring-dma = ["rp1-proto/unstable-ring-dma"]

[dependencies]
rp1-pac = { path = "../rp1-pac" }
# The application picks the critical-section implementation (rp1-rt's default feature or its
# own), so this crate must not switch the default on.
rp1-rt = { path = "../rp1-rt", default-features = false }
rp1-proto = { path = "../rp1-proto" }
embedded-hal = "1"
fugit = { version = "0.3.9", default-features = false }
embedded-hal-0-2 = { package = "embedded-hal", version = "0.2.7", features = ["unproven"] }
nb = "1"
embedded-io = "0.6"

[dev-dependencies]
trybuild = "1"
