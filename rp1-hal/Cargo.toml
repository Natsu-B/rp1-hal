[package]
name = "rp1-hal"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# proc1 -> Linux interrupt on RP1 MSI-X vector 29 (`host_irq`, TIMER alarm 3, which host_irq
# owns). Unstable: delivery is a hint that receivers must re-check (docs/design.md 6.2).
unstable-host-irq = []

[dependencies]
rp1-pac = { path = "../rp1-pac" }
rp1-rt = { path = "../rp1-rt" }
rp1-proto = { path = "../rp1-proto" }
embedded-hal = "1"
embedded-hal-0-2 = { package = "embedded-hal", version = "0.2.7", features = ["unproven"] }
nb = "1"
embedded-io = "0.6"

[dev-dependencies]
trybuild = "1"
