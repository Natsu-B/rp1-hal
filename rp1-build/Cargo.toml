[package]
name = "rp1-build"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rp1-pac = { path = "../rp1-pac" }
rp1-pinmux = { path = "../rp1-pinmux" }
rp1-proto = { path = "../rp1-proto" }
rp1-dt = { path = "../rp1-dt" }
toml = "0.8"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
object = { version = "0.36", features = ["read"] }

[dev-dependencies]
static_assertions = "1"
rp1-rt = { path = "../rp1-rt", features = ["experimental-link-wake"] }
rp1-hal = { path = "../rp1-hal" }
rp1-link = { path = "../rp1-link" }
tempfile = "3"
trybuild = "1"
