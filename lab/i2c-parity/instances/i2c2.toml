[package]
name = "i2c-parity"
version = "0.1.0"

[package.metadata.rp1]
schema = 2
board = "rpi-cm5"
clock = { authority = "rp1", clk_sys_hz = 200000000 }
log = { sink = "uart0", baudrate = 115200 }
stack = { proc0 = "6KiB" }

[package.metadata.rp1.proc0]
gpio = [22, 23]
i2c2 = { sda = 12, scl = 13 }
wait_timer = "ALARM1"
