[package]
name = "i2c-parity"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "i2c-parity"
test = false
bench = false

[features]
i2c0 = []
i2c2 = []
i2c3 = []

[dependencies]
embedded-hal = "1"
rp1-hal = { path = "../../rp1-hal" }
rp1-rt = { path = "../../rp1-rt" }

[build-dependencies]
rp1-build = { path = "../../rp1-build" }

[package.metadata.rp1]
schema = 2
board = "rpi-cm5"
clock = { authority = "rp1", clk_sys_hz = 200000000 }
log = { sink = "uart0", baudrate = 115200 }
stack = { proc0 = "6KiB" }

[package.metadata.rp1.proc0]
i2c1 = { sda = 2, scl = 3 }
wait_timer = "ALARM1"
