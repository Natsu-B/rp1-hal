[package]
name = "spi-parity"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "spi-parity"
test = false
bench = false

[features]
spi1 = []
spi3 = []

[dependencies]
embedded-hal = "1"
rp1-hal = { path = "../../rp1-hal" }
rp1-rt = { path = "../../rp1-rt" }

[build-dependencies]
rp1-build = { path = "../../rp1-build" }

[package.metadata.rp1]
schema = 2
board = "rpi-cm5"
clock = { authority = "rp1", clk_sys_hz = 200000000 }
log = { sink = "uart0", baudrate = 115200 }
stack = { proc0 = "6KiB" }

[package.metadata.rp1.proc0]
gpio = [8, 12, 13, 22, 23] # Strobe, CS sense inputs, CS outputs.
spi0 = { sck = 11, mosi = 10, miso = 9 }
timer = ["ALARM0"] # Inject RX underflow at a known point inside a CS transaction.
wait_timer = "ALARM1"
