[package]
name = "shm-firmware"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "shm-firmware"
test = false
bench = false

[features]
default = ["i2c", "adc", "spi"]
i2c = ["dep:embedded-hal"]
adc = ["dep:embedded-hal-0-2", "dep:nb"]
spi = ["dep:embedded-hal"]
sram-profile = []
dma = []
# DMA ring producer proof (command 17); a focused image: `--no-default-features --features ring-dma`.
ring-dma = []

[dependencies]
rp1-hal = { path = "../../rp1-hal", features = ["unstable-host-irq"] }
rp1-rt = { path = "../../rp1-rt" }
rp1-proto = { path = "../../rp1-proto" }
embedded-hal = { version = "1", optional = true }
embedded-hal-0-2 = { package = "embedded-hal", version = "0.2.7", features = ["unproven"], optional = true }
nb = { version = "1", optional = true }

[build-dependencies]
rp1-build = { path = "../../rp1-build" }

[package.metadata.rp1]
schema = 2
board = "rpi-cm5"
clock = { authority = "rp1", clk_sys_hz = 200000000 }
# UART0 (GPIO 14/15) carries the RP1 log. Linux keeps UART1 (GPIO 0/1) by the board default.
log = { sink = "uart0", baudrate = 115200 }
# proc1: the DMA ring proof (command 17) keeps a batch of up to 2 KiB of messages on the stack.
stack = { proc0 = "2KiB", proc1 = "6KiB" }

[package.metadata.rp1.proc0]
gpio = [22]
timer = ["ALARM0"]
i2c1 = { sda = 2, scl = 3 }

[package.metadata.rp1.proc1]
gpio = [8, 27] # 8 = SPI0 chip select driven as GPIO
gpio_irq = [27]
timer = ["ALARM1"]
adc = {}
spi0 = { sck = 11, mosi = 10, miso = 9 }
dma = {} # the whole DMA controller (Linux rp1_dma is disabled)
host_irq = true # unstable: RP1 -> Linux interrupt on MSI-X vector 29 (TIMER alarm 3, rp1:irq UIO)

[[package.metadata.rp1.shm]]
name = "up"
kind = "ring"
core = "proc1"
message = "Sample"
direction = "rp1-to-linux"
depth = 256
overflow = "reject"

[[package.metadata.rp1.shm]]
name = "down"
kind = "ring"
core = "proc1"
message = "Sample"
direction = "linux-to-rp1"
depth = 128
overflow = "reject"

[[package.metadata.rp1.shm]]
name = "latest"
kind = "ring"
core = "proc1"
message = "Sample"
direction = "rp1-to-linux"
depth = 16
overflow = "overwrite"

# RP1 -> Linux ring with interrupt notification (rp1_hal::host_irq::HostIrq::notify_ring,
# rp1_linux::RingRx::wait); proc1 declares host_irq, as notify = "irq" requires.
[[package.metadata.rp1.shm]]
name = "events"
kind = "ring"
core = "proc1"
message = "Sample"
direction = "rp1-to-linux"
depth = 256
overflow = "reject"
notify = "irq"

# Wider RP1 -> Linux rings for the DMA ring producer (rp1_hal::shm::RingDma, command 17 with
# the `dma` feature); declared in every profile.
[[package.metadata.rp1.shm]]
name = "wide64"
kind = "ring"
core = "proc1"
message = "Wide64"
direction = "rp1-to-linux"
depth = 256
overflow = "reject"
notify = "irq"

[[package.metadata.rp1.shm]]
name = "wide256"
kind = "ring"
core = "proc1"
message = "Wide256"
direction = "rp1-to-linux"
depth = 128
overflow = "reject"
notify = "irq"

[[package.metadata.rp1.shm]]
name = "control"
kind = "block"
core = "proc1"
type = "Control"
writer = "both"

[[package.metadata.rp1.shm]]
name = "bulk"
kind = "block"
core = "proc1"
type = "Bulk"
writer = "both"
