[package]
name = "shm-firmware"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "shm-firmware"
test = false
bench = false

[dependencies]
rp1-hal = { path = "../../rp1-hal" }
rp1-rt = { path = "../../rp1-rt" }
rp1-proto = { path = "../../rp1-proto" }
embedded-hal = "1"
embedded-hal-0-2 = { package = "embedded-hal", version = "0.2.7", features = ["unproven"] }
nb = "1"

[build-dependencies]
rp1-build = { path = "../../rp1-build" }

[package.metadata.rp1]
schema = 1
board = "rpi-cm5"
clock = { authority = "rp1", clk_sys_hz = 200000000 }
log = { sink = "uart0", baudrate = 115200 }

[package.metadata.rp1.proc0]
pins = [2, 3, 22]
peripherals = ["TIMER.ALARM0", "I2C1"]

[package.metadata.rp1.proc1]
pins = [8, 9, 10, 11, 27]
gpio_irq = [27]
peripherals = ["TIMER.ALARM1", "ADC", "SPI0"]

[[package.metadata.rp1.shm]]
name = "up"
kind = "ring"
core = "proc1"
message = "Sample"
direction = "rp1-to-linux"
depth = 256
overflow = "reject"

[[package.metadata.rp1.shm]]
name = "down"
kind = "ring"
core = "proc1"
message = "Sample"
direction = "linux-to-rp1"
depth = 128
overflow = "reject"

[[package.metadata.rp1.shm]]
name = "latest"
kind = "ring"
core = "proc1"
message = "Sample"
direction = "rp1-to-linux"
depth = 16
overflow = "overwrite"

[[package.metadata.rp1.shm]]
name = "control"
kind = "block"
core = "proc1"
type = "Control"
writer = "both"

[[package.metadata.rp1.shm]]
name = "bulk"
kind = "block"
core = "proc1"
type = "Bulk"
writer = "both"
