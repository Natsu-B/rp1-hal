[package]
name = "shm-firmware"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "shm-firmware"
test = false
bench = false

[dependencies]
rp1-hal = { path = "../../rp1-hal", features = ["unstable-host-irq"] }
rp1-rt = { path = "../../rp1-rt" }
rp1-proto = { path = "../../rp1-proto" }
embedded-hal = "1"
embedded-hal-0-2 = { package = "embedded-hal", version = "0.2.7", features = ["unproven"] }
nb = "1"

[build-dependencies]
rp1-build = { path = "../../rp1-build" }

[package.metadata.rp1]
schema = 2
board = "rpi-cm5"
clock = { authority = "rp1", clk_sys_hz = 200000000 }
# UART0 (GPIO 14/15) carries the RP1 log. Linux keeps UART1 (GPIO 0/1) by the board default.
log = { sink = "uart0", baudrate = 115200 }

[package.metadata.rp1.proc0]
gpio = [22]
timer = ["ALARM0"]
i2c1 = { sda = 2, scl = 3 }

[package.metadata.rp1.proc1]
gpio = [8, 27] # 8 = SPI0 chip select driven as GPIO
gpio_irq = [27]
timer = ["ALARM1"]
adc = {}
spi0 = { sck = 11, mosi = 10, miso = 9 }
host_irq = true # unstable: RP1 -> Linux interrupt on MSI-X vector 57 (rp1:irq UIO)

[[package.metadata.rp1.shm]]
name = "up"
kind = "ring"
core = "proc1"
message = "Sample"
direction = "rp1-to-linux"
depth = 256
overflow = "reject"

[[package.metadata.rp1.shm]]
name = "down"
kind = "ring"
core = "proc1"
message = "Sample"
direction = "linux-to-rp1"
depth = 128
overflow = "reject"

[[package.metadata.rp1.shm]]
name = "latest"
kind = "ring"
core = "proc1"
message = "Sample"
direction = "rp1-to-linux"
depth = 16
overflow = "overwrite"

[[package.metadata.rp1.shm]]
name = "control"
kind = "block"
core = "proc1"
type = "Control"
writer = "both"

[[package.metadata.rp1.shm]]
name = "bulk"
kind = "block"
core = "proc1"
type = "Bulk"
writer = "both"
