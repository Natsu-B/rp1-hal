[package]
name = "shm-linux"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
sram-profile = []

[dependencies]
rp1-linux = { path = "../../rp1-linux" }
rp1-proto = { path = "../../rp1-proto" }
libc = "0.2"
# Only for the ring-dma client: it predicts the firmware's path from RingDma::DEFAULT_THRESHOLD.
rp1-hal = { path = "../../rp1-hal", features = ["unstable-ring-dma"] }
