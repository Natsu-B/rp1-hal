[package]
name = "timer-parity"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "timer-parity"
test = false
bench = false

[dependencies]
embedded-hal = "1"
rp1-hal = { path = "../../rp1-hal" }
rp1-rt = { path = "../../rp1-rt" }

[build-dependencies]
rp1-build = { path = "../../rp1-build" }

[package.metadata.rp1]
schema = 2
board = "rpi-cm5"
clock = { authority = "rp1", clk_sys_hz = 200000000 }
log = { sink = "uart0", baudrate = 115200 }

[package.metadata.rp1.proc1]
gpio = [12, 13] # GPIO12 brackets the delay, GPIO13 toggles in the 1 kHz ISR.
# ALARM0 uses a lab wrapper around the production wait ISR to count IRQ entries.
timer = ["ALARM0", "ALARM1"]
