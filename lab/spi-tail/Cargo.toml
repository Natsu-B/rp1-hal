[package]
name = "spi-tail"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "spi-tail"
test = false
bench = false

[dependencies]
embedded-hal = "1"
rp1-hal = { path = "../../rp1-hal" }
rp1-rt = { path = "../../rp1-rt" }
rp1-proto = { path = "../../rp1-proto" }

[build-dependencies]
rp1-build = { path = "../../rp1-build" }

[package.metadata.rp1]
schema = 2
board = "rpi-cm5"
clock = { authority = "rp1", clk_sys_hz = 200000000 }
log = { sink = "uart0", baudrate = 115200 }
stack = { proc0 = "6KiB" }

[package.metadata.rp1.proc0]
spi0 = { sck = 11, mosi = 10, miso = 9 }
spi1 = { sck = 21, mosi = 20, miso = 19 }
spi3 = { sck = 7, mosi = 6, miso = 5 }
wait_timer = "ALARM1"
