[package]
name = "dma-parity"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "dma-parity"
test = false
bench = false

[dependencies]
rp1-hal = { path = "../../rp1-hal" }
rp1-rt = { path = "../../rp1-rt" }

[build-dependencies]
rp1-build = { path = "../../rp1-build" }

[package.metadata.rp1]
schema = 2
board = "rpi-cm5"
clock = { authority = "rp1", clk_sys_hz = 200000000 }
log = { sink = "uart0", baudrate = 115200 }

[package.metadata.rp1.proc1]
dma = {}
wait_timer = "ALARM1"
