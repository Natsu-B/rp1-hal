[package]
name = "adc-parity"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "adc-parity"
test = false
bench = false

[dependencies]
embedded-hal-0-2 = { package = "embedded-hal", version = "0.2.7", features = ["unproven"] }
nb = "1"
rp1-hal = { path = "../../rp1-hal", features = ["eh02"] }
rp1-rt = { path = "../../rp1-rt" }

[build-dependencies]
rp1-build = { path = "../../rp1-build" }

[package.metadata.rp1]
schema = 2
board = "rpi-cm5"
clock = { authority = "rp1", clk_sys_hz = 200000000 }
log = { sink = "uart0", baudrate = 115200 }

[package.metadata.rp1.proc0]
adc = {}
wait_timer = "ALARM1"
