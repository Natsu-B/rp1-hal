[package]
name = "uart-parity"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "uart-parity"
test = false
bench = false

[dependencies]
embedded-io = "0.6"
rp1-hal = { path = "../../rp1-hal" }
rp1-rt = { path = "../../rp1-rt" }

[build-dependencies]
rp1-build = { path = "../../rp1-build" }

[package.metadata.rp1]
schema = 2
board = "rpi-cm5"
clock = { authority = "rp1", clk_sys_hz = 200000000 }
log = { sink = "uart0", baudrate = 115200 }
linux.keep = {}

[package.metadata.rp1.proc0]
uart1 = { tx = 0, rx = 1 }
wait_timer = "ALARM1"
