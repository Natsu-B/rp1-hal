[package]
name = "irq-priority"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "irq-priority"
test = false
bench = false

[dependencies]
embedded-hal = "1"
rp1-hal = { path = "../../rp1-hal" }
rp1-rt = { path = "../../rp1-rt" }
rp1-proto = { path = "../../rp1-proto" }

[build-dependencies]
rp1-build = { path = "../../rp1-build" }

[package.metadata.rp1]
schema = 2
board = "rpi-cm5"
clock = { authority = "rp1", clk_sys_hz = 200000000 }
log = { sink = "uart0", baudrate = 115200 }
linux.keep = {}

[package.metadata.rp1.proc0]
gpio = [13, 23]
spi0 = { sck = 11, mosi = 10, miso = 9 }
uart1 = { tx = 0, rx = 1 }
timer = ["ALARM0", "ALARM3"]
wait_timer = "ALARM2"

[package.metadata.rp1.proc1]
timer = ["ALARM1"]
