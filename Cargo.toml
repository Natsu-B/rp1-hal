[workspace]
resolver = "2"
members = ["rp1-pac", "rp1-regdb", "rp1-proto", "rp1-macros", "rp1-rt", "rp1-hal", "rp1-build", "cargo-rp1", "examples/dual-core", "examples/linux-doorbell"]
default-members = ["rp1-pac", "rp1-regdb", "rp1-proto", "rp1-macros", "rp1-rt", "rp1-hal", "rp1-build", "cargo-rp1", "examples/linux-doorbell"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
panic = "abort"
