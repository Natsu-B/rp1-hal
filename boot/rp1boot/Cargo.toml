[package]
name = "rp1boot"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "BCM2712 third-stage loader: checks the boot bundle, applies the RP1 overlay, loads RP1 over I2C and enters Linux at EL2"

[dependencies]
rp1-proto = { path = "../../rp1-proto" }
rp1-dt = { path = "../../rp1-dt" }
sha2 = { version = "0.10", default-features = false }

[[bin]]
name = "rp1boot"
test = false
