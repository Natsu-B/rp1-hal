[peripheral]
id = "pads_bank2"
name = "PADS_BANK2"
module = "pads_bank2"
kind = "rp1-native-apb"
base = 0x400f8000
size = 0x1000
ownership = "singleton"
default_origin = "linux"
legacy_svd_name = "PADS_BANK2_RW"
note = "RP1 PADS_BANK2 register block with supplemental register semantics. Alias behavior: normal read/write access. Bank geometry and pad fields are recovered from the Linux pinctrl driver; fields are inherited from the public bank-0 layout. Unknown offsets remain split RAW arrays."

[peripheral.atomic_view]
kind = "rp1-native"
xor_offset = 0x1000
set_offset = 0x2000
clear_offset = 0x3000

[[register]]
id = "voltage_select"
name = "VOLTAGE_SELECT"
offset = 0x0
width = 32
repeat_count = 1
repeat_stride = 4
hardware_read = "plain"
hardware_write = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "Selects the input threshold levels for the whole bank. Choose the 1.8 V setting only when VDDIO is nominally 1.8 V; using it with a higher supply can damage the chip. Keeping the default setting at 1.8 V may give thresholds outside specification."
[register.api]
read = "public"
modify = "public"
raw_write = "unsafe"
[register.atomic]
kind = "rp1-native"
set = "typed"
clear = "typed"
xor = "typed"
[[register.field]]
id = "voltage_select"
name = "VOLTAGE_SELECT"
lsb = 0
width = 1
api_read = "public"
api_write = "public"
write_behavior = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "0 = thresholds for 2.5 V to 3.3 V VDDIO; 1 = thresholds for 1.8 V VDDIO. Only the input thresholds change, not the supply voltage."

[[register]]
id = "gpio"
name = "GPIO"
offset = 0x4
width = 32
repeat_count = 20
repeat_stride = 4
hardware_read = "plain"
hardware_write = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "Electrical controls for one pad; function selection is in IO_BANK. With the output not driving, PUE/PDE select the bias: 0/0 floating, 1/0 weak pull to high, 0/1 weak pull to low, 1/1 keeper that holds the last driven level."
[register.api]
read = "public"
modify = "public"
raw_write = "unsafe"
[register.atomic]
kind = "rp1-native"
set = "typed"
clear = "typed"
xor = "typed"
[[register.field]]
id = "slewfast"
name = "SLEWFAST"
lsb = 0
width = 1
api_read = "public"
api_write = "public"
write_behavior = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "Output slew rate. 0 slow (limited edge rate), 1 fast."
[[register.field]]
id = "schmitt"
name = "SCHMITT"
lsb = 1
width = 1
api_read = "public"
api_write = "public"
write_behavior = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "Input hysteresis (Schmitt trigger). 0 off, 1 on."
[[register.field]]
id = "pde"
name = "PDE"
lsb = 2
width = 1
api_read = "public"
api_write = "public"
write_behavior = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "Weak pull-down (to ground) enable. Setting both PDE and PUE gives a bus keeper."
[[register.field]]
id = "pue"
name = "PUE"
lsb = 3
width = 1
api_read = "public"
api_write = "public"
write_behavior = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "Weak pull-up (to VDDIO) enable. Setting both PUE and PDE gives a bus keeper."
[[register.field]]
id = "drive"
name = "DRIVE"
lsb = 4
width = 2
api_read = "public"
api_write = "public"
write_behavior = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "Output drive strength: 0 = 2 mA, 1 = 4 mA, 2 = 8 mA, 3 = 12 mA."
[[register.field]]
id = "ie"
name = "IE"
lsb = 6
width = 1
api_read = "public"
api_write = "public"
write_behavior = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "Input enable. 0 powers the input buffer down; 1 enables it. Unused pads may leave it off."
[[register.field]]
id = "od"
name = "OD"
lsb = 7
width = 1
api_read = "public"
api_write = "public"
write_behavior = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "Output disable. 1 blocks the output driver even when the selected function enables output; 0 leaves the output enable to IO_BANK."
