[peripheral]
id = "pcie_apbs"
name = "PCIE_APBS"
module = "pcie_apbs"
kind = "rp1-native-apb"
base = 0x40108000
size = 0x1000
ownership = "singleton"
default_origin = "linux"
legacy_svd_name = "PCIE_RW"
note = "Only independently understood pre-DBI controller registers are exposed; state-machine-only controls remain hidden."

[peripheral.atomic_view]
kind = "rp1-native"
xor_offset = 0x1000
set_offset = 0x2000
clear_offset = 0x3000

[[peripheral.custom_views]]
id = "msix-set"
kind = "set"
offset = 0x800

[[peripheral.custom_views]]
id = "msix-clear"
kind = "clear"
offset = 0xc00

[[register]]
id = "dbi"
name = "DBI"
offset = 0x0
width = 32
repeat_count = 1
repeat_stride = 4
hardware_read = "plain"
hardware_write = "state-machine-only"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "Chooses the internal target and address context used by following DBI accesses. PAC writes are restricted to sequenced state-machine code."
[register.api]
read = "public"
[[register.field]]
id = "asel"
name = "ASEL"
lsb = 0
width = 2
api_read = "public"
write_behavior = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "DBI target: 0 normal/misc window, 1 shadow window, 2 ELBI, 3 iATU/DMA. Bit 0 drives CS2; bit 1 selects between the CDM and ELBI paths."
[[register.field.enum_value]]
name = "NORMAL_MISC"
value = 0x0
note = "Access the normal DBI window holding configuration and miscellaneous registers."
[[register.field.enum_value]]
name = "SHADOW"
value = 0x1
note = "Access the shadow register window."
[[register.field.enum_value]]
name = "ELBI"
value = 0x2
note = "Access the ELBI bus."
[[register.field.enum_value]]
name = "IATU_DMA"
value = 0x3
note = "Access the address translation unit or DMA registers."
[[register.field]]
id = "func_num"
name = "FUNC_NUM"
lsb = 2
width = 3
api_read = "public"
write_behavior = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "PCIe function number for CDM accesses. Which functions exist is not known."
[[register.field]]
id = "atu_region"
name = "ATU_REGION"
lsb = 5
width = 9
api_read = "public"
write_behavior = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "Translation region and direction (inbound or outbound) for iATU accesses. How these are packed into the field is not known."

[[register]]
id = "control"
name = "CONTROL"
offset = 0x4
width = 32
repeat_count = 1
repeat_stride = 4
hardware_read = "plain"
hardware_write = "state-machine-only"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "Endpoint integration controls: resets, DBI write protection, link training, clock routing and memory power. PAC writes are restricted to sequenced state-machine code."
[register.api]
read = "public"
[[register.field]]
id = "app_req_retry_en"
name = "APP_REQ_RETRY_EN"
lsb = 0
width = 1
api_read = "public"
write_behavior = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "1 answers incoming PCIe configuration requests with retry status, postponing normal handling. 0 handles them normally."
[[register.field]]
id = "app_dbi_ro_wr_disable"
name = "APP_DBI_RO_WR_DISABLE"
lsb = 1
width = 1
api_read = "public"
write_behavior = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "1 prevents writes to the DBI override bit MISC_CONTROL_1.DBI_RO_WR_EN. 0 lifts the block."
[[register.field]]
id = "app_ltssm_enable"
name = "APP_LTSSM_ENABLE"
lsb = 2
width = 1
api_read = "public"
write_behavior = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "1 allows the endpoint to train and bring up the link. 0 holds training off."
[[register.field]]
id = "set_hot_rst_app_ltssm_enable"
name = "SET_HOT_RST_APP_LTSSM_ENABLE"
lsb = 3
width = 1
api_read = "public"
write_behavior = "self-clearing"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "Write 1 to allow link training again after a hot reset request. Self-clearing."
[[register.field]]
id = "clk2fc_sel"
name = "CLK2FC_SEL"
lsb = 4
width = 3
api_read = "public"
write_behavior = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "Clock routed to the frequency counter; 0 disconnects it. Nominal rates by code (MHz): 1 variable, 2 125, 3 125 or 250, 4 100, 5 125, 6 and 7 250. The source names, and what picks 125 or 250 for code 3, are not known."
[[register.field]]
id = "cperstn_disable"
name = "CPERSTN_DISABLE"
lsb = 7
width = 1
api_read = "public"
write_behavior = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "1 disables the CPERSTN source. How this interacts with cperstn_assert is not known."
[[register.field]]
id = "cperstn_assert"
name = "CPERSTN_ASSERT"
lsb = 8
width = 1
api_read = "public"
write_behavior = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "1 asks for CPERSTN to be asserted by software, subject to the reset gating. Precedence against other sources is not known."
[[register.field]]
id = "mem_pd"
name = "MEM_PD"
lsb = 9
width = 1
api_read = "public"
write_behavior = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "1 powers down the PCIe memory arrays. Content retention and the wake-up sequence are not known."

[[register]]
id = "msix_cfg"
name = "MSIX_CFG"
offset = 0x8
width = 32
repeat_count = 64
repeat_stride = 4
public_count = 61
hardware_read = "plain"
hardware_write = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "64 physical slots are retained for layout; only 61 Linux-visible vectors are publicly indexed. IACK is self-clearing and has no writer."
[register.api]
read = "public"
[register.atomic]
kind = "custom"
set = "typed"
clear = "typed"
set_view = "msix-set"
clear_view = "msix-clear"
[[register.field]]
id = "enable"
name = "ENABLE"
lsb = 0
width = 1
api_read = "public"
api_write = "public"
write_behavior = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "1 allows this vector to generate MSI-X messages; 0 disables it. Messages are also subject to the PCIe MSI-X capability settings."
[[register.field]]
id = "test"
name = "TEST"
lsb = 1
width = 1
api_read = "public"
api_write = "public"
write_behavior = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "1 ORs an asserted level into the source; 0 uses only the external source. If the vector is enabled, the rising edge can send a message."
[[register.field]]
id = "iack"
name = "IACK"
lsb = 2
width = 1
api_read = "public"
write_behavior = "self-clearing"
verified_read = "official"
verified_write = "unverified"
origin = "official"
note = "With iack_en=1, write 1 to release the auto-mask; hardware clears the bit. If the source is still high, another MSI-X write may follow."
[[register.field]]
id = "iack_en"
name = "IACK_EN"
lsb = 3
width = 1
api_read = "public"
api_write = "public"
write_behavior = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "0: plain rising-edge signalling. 1: the vector is masked automatically when a message is sent and stays masked until iack is written. Use 1 for level sources that can stay high while being serviced."
[[register.field]]
id = "tc"
name = "TC"
lsb = 12
width = 3
api_read = "public"
write_behavior = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "Traffic class (0-7) of the MSI-X write TLP."
[[register.field]]
id = "func"
name = "FUNC"
lsb = 16
width = 3
api_read = "public"
write_behavior = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "PCIe function that owns this vector. Which function numbers exist is not known."

