[peripheral]
id = "sys_rio0"
name = "SYS_RIO0"
module = "sys_rio0"
kind = "rp1-native-apb"
base = 0x400e0000
size = 0x1000
ownership = "singleton"
default_origin = "official"
legacy_svd_name = "SYS_RIO0_RW"
note = "Host-side GPIO RIO block for bank 0: output latch, output enable and input sample registers. Bus=APB. Atomic aliases: XOR at +0x1000, SET at +0x2000, CLR at +0x3000."

[peripheral.atomic_view]
kind = "rp1-native"
xor_offset = 0x1000
set_offset = 0x2000
clear_offset = 0x3000

[[register]]
id = "out"
name = "OUT"
offset = 0x0
width = 32
repeat_count = 1
repeat_stride = 4
hardware_read = "plain"
hardware_write = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
reset_value = 0x0
note = "Output data latch for host GPIO. A pin shows this value only when its mux selects the system RIO function, `oe` enables drive, and no pad or mux override applies. Supports the SET/CLR/XOR aliases."
[register.api]
read = "public"
modify = "public"
raw_write = "unsafe"
[register.atomic]
