[peripheral]
id = "uart5"
name = "UART5"
module = "uart5"
kind = "external-ip"
base = 0x40044000
size = 0x1000
ownership = "singleton"
default_origin = "official"
legacy_svd_name = "UART5"
external_ip = "arm-pl011"
clock_dependency = "uartclk and apb_pclk"
reset_dependency = "RESETS.CTRL1.UART5"
pinmux_dependency = "IO_BANK/PADS selection"
note = "Arm PL011 UART, with a baud clock separate from the APB clock. APB bus. No RP1 XOR/SET/CLEAR alias window is defined."
