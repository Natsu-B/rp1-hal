[peripheral]
id = "audio_in"
name = "AUDIO_IN"
module = "audio_in"
kind = "rp1-native-apb"
base = 0x40090000
size = 0x1000
ownership = "singleton"
default_origin = "official"
legacy_svd_name = "AUDIO_IN_RW"
note = "Digital microphone input block. It can generate the microphone clock driven out on the pads from its own audio clock. APB bus. Plain read/write at the base; XOR, SET and CLEAR aliases at +0x1000, +0x2000 and +0x3000."

[peripheral.atomic_view]
kind = "rp1-native"
xor_offset = 0x1000
set_offset = 0x2000
clear_offset = 0x3000
