lsb = 21
width = 1
api_read = "public"
write_behavior = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "1 includes the raw rising-edge event in this pin's combined interrupt; 0 leaves it out."
[[register.field]]
