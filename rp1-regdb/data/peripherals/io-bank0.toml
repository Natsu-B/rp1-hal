[peripheral]
id = "io_bank0"
name = "IO_BANK0"
module = "io_bank0"
kind = "rp1-native-apb"
base = 0x400d0000
size = 0x1000
ownership = "singleton"
default_origin = "official"
legacy_svd_name = "IO_BANK0_RW"
note = "GPIO bank 0 function select, signal overrides and per-pin interrupt routing. Bus=APB. Atomic aliases: XOR at +0x1000, SET at +0x2000, CLR at +0x3000."

[peripheral.atomic_view]
kind = "rp1-native"
xor_offset = 0x1000
set_offset = 0x2000
clear_offset = 0x3000

[[register]]
id = "gpio_status"
name = "GPIO_STATUS"
offset = 0x0
width = 32
repeat_count = 28
repeat_stride = 8
hardware_read = "plain"
hardware_write = "none"
verified_read = "official"
verified_write = "not-applicable"
origin = "official"
reset_value = 0x0
note = "Per-pad status: signal values along the input and output paths, and the interrupt event detectors. Inactive flags read 0. Edge events stay set until cleared with GPIO_CTRL.IRQRESET; level events follow the current detector state."
[register.api]
read = "public"
