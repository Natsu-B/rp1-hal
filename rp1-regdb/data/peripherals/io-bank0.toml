width = 1
api_read = "public"
write_behavior = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "1 includes the raw low-level event in this pin's combined interrupt; 0 leaves it out."
[[register.field]]
id = "irqmask_level_high"
name = "IRQMASK_LEVEL_HIGH"
lsb = 23
width = 1
api_read = "public"
write_behavior = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "1 includes the raw high-level event in this pin's combined interrupt; 0 leaves it out."
[[register.field]]
id = "irqmask_f_edge_low"
name = "IRQMASK_F_EDGE_LOW"
lsb = 24
width = 1
api_read = "public"
write_behavior = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "1 includes the filtered falling-edge event in this pin's combined interrupt; 0 leaves it out."
[[register.field]]
id = "irqmask_f_edge_high"
name = "IRQMASK_F_EDGE_HIGH"
lsb = 25
width = 1
api_read = "public"
write_behavior = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "1 includes the filtered rising-edge event in this pin's combined interrupt; 0 leaves it out."
[[register.field]]
id = "irqmask_db_level_low"
name = "IRQMASK_DB_LEVEL_LOW"
lsb = 26
width = 1
api_read = "public"
write_behavior = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "1 includes the debounced low-level event in this pin's combined interrupt; 0 leaves it out."
[[register.field]]
id = "irqmask_db_level_high"
name = "IRQMASK_DB_LEVEL_HIGH"
lsb = 27
width = 1
api_read = "public"
write_behavior = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "1 includes the debounced high-level event in this pin's combined interrupt; 0 leaves it out."
[[register.field]]
id = "irqreset"
name = "IRQRESET"
lsb = 28
width = 1
api_read = "public"
write_behavior = "self-clearing"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "Write 1 to clear this pad's latched edge events; the bit then returns to 0 by itself. Writing 0 has no effect. Level events that are still active assert again."
[[register.field]]
id = "irqover"
name = "IRQOVER"
lsb = 30
width = 2
api_read = "public"
write_behavior = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "Interrupt override, applied to this pin's combined interrupt. 0 passes it through, 1 inverts it, 2 forces 0, 3 forces 1."
[[register.field.enum_value]]
name = "NORMAL"
value = 0x0
note = "Pass the combined interrupt through unchanged."
[[register.field.enum_value]]
name = "INVERTED"
value = 0x1
note = "Invert the combined interrupt."
[[register.field.enum_value]]
name = "LOW"
value = 0x2
note = "Force this pin's interrupt to 0."
[[register.field.enum_value]]
name = "HIGH"
value = 0x3
note = "Force this pin's interrupt to 1."

