lsb = 0
width = 1
api_read = "public"
api_write = "public"
write_behavior = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "On a `dma_finish` pulse from the DMAC: 0 keeps the request enables, 1 clears both `req` and `single`."
[[register.field]]
id = "disable"
