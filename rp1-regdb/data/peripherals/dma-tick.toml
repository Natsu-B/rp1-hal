[peripheral]
id = "dma_tick"
name = "DMA_TICK"
module = "dma_tick"
kind = "rp1-native-apb"
base = 0x40158000
size = 0x1000
ownership = "singleton"
default_origin = "official"
legacy_svd_name = "DMA_TICK_RW"
note = "Two paced DMA request generators driven by the TICKS DMA tick channels. Bus=APB. Atomic aliases: XOR at +0x1000, SET at +0x2000, CLR at +0x3000."

[peripheral.atomic_view]
kind = "rp1-native"
xor_offset = 0x1000
set_offset = 0x2000
clear_offset = 0x3000

[[register]]
id = "tick0_en"
name = "TICK0_EN"
offset = 0x0
width = 32
repeat_count = 1
repeat_stride = 4
hardware_read = "plain"
hardware_write = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
reset_value = 0x0
note = "DMA handshake enables for tick channel 0. Hardware clears these enables on an abort, or on a DMA finish when `finish_clear` is set."
[register.api]
read = "public"
modify = "public"
raw_write = "unsafe"
[register.atomic]
kind = "rp1-native"
set = "typed"
clear = "typed"
xor = "typed"
[[register.field]]
id = "req"
name = "REQ"
lsb = 0
width = 1
api_read = "public"
api_write = "public"
write_behavior = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "Paced request enable: 0 no requests, 1 this tick channel may raise a DMA handshake."
[[register.field]]
id = "single"
name = "SINGLE"
lsb = 1
width = 1
api_read = "public"
api_write = "public"
write_behavior = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "Only used with `req=1`. 0 raises burst requests only; 1 also asserts `dma_single`."

[[register]]
id = "tick0_ctrl"
name = "TICK0_CTRL"
offset = 0x4
width = 32
repeat_count = 1
repeat_stride = 4
hardware_read = "plain"
hardware_write = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
reset_value = 0x0
note = "Pacing and termination control for tick channel 0, paced by `TICKS.DMA0`."
[register.api]
read = "public"
modify = "public"
raw_write = "unsafe"
[register.atomic]
kind = "rp1-native"
set = "typed"
clear = "typed"
xor = "typed"
[[register.field]]
id = "finish_clear"
name = "FINISH_CLEAR"
lsb = 0
width = 1
api_read = "public"
api_write = "public"
write_behavior = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "On a `dma_finish` pulse from the DMAC: 0 keeps the request enables, 1 clears both `req` and `single`."
[[register.field]]
id = "disable"
name = "DISABLE"
lsb = 1
width = 1
api_write = "public"
write_behavior = "plain"
verified_read = "not-applicable"
verified_write = "official"
origin = "official"
note = "Writing 1 through the SET alias aborts the handshake; writing 0 there does nothing. An abort can race a DMAC transfer already in progress."
[[register.field]]
id = "dwell"
name = "DWELL"
lsb = 4
width = 5
api_read = "public"
api_write = "public"
write_behavior = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "Extra bus-clock cycles added to the idle gap of the handshake."
[[register.field]]
id = "dreq"
name = "DREQ"
lsb = 12
width = 1
api_read = "public"
write_behavior = "read-only"
verified_read = "official"
verified_write = "not-applicable"
origin = "official"
note = "Debug view of the incoming request pulse, which lasts one cycle."

[[register]]
id = "tick1_en"
name = "TICK1_EN"
offset = 0x8
width = 32
repeat_count = 1
repeat_stride = 4
hardware_read = "plain"
hardware_write = "plain"
