verified_write = "official"
origin = "official"
reset_value = 0x0
note = "DMA handshake enables for tick channel 1. Hardware clears these enables on an abort, or on a DMA finish when `finish_clear` is set."
[register.api]
read = "public"
modify = "public"
raw_write = "unsafe"
[register.atomic]
kind = "rp1-native"
set = "typed"
clear = "typed"
xor = "typed"
[[register.field]]
id = "req"
name = "REQ"
lsb = 0
width = 1
api_read = "public"
api_write = "public"
write_behavior = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "Paced request enable: 0 no requests, 1 this tick channel may raise a DMA handshake."
[[register.field]]
id = "single"
