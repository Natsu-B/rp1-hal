lsb = 1
width = 1
api_read = "public"
api_write = "public"
write_behavior = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "Only used with `req=1`. 0 raises burst requests only; 1 also asserts `dma_single`."

