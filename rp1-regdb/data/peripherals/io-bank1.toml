lsb = 25
width = 1
api_read = "public"
write_behavior = "read-only"
verified_read = "official"
verified_write = "not-applicable"
origin = "official"
note = "Latched when the filtered input rises."
[[register.field]]
id = "event_db_level_low"
name = "EVENT_DB_LEVEL_LOW"
lsb = 26
width = 1
api_read = "public"
write_behavior = "read-only"
verified_read = "official"
verified_write = "not-applicable"
origin = "official"
note = "Set once the input has stayed low for the debounce interval."
[[register.field]]
id = "event_db_level_high"
name = "EVENT_DB_LEVEL_HIGH"
lsb = 27
width = 1
api_read = "public"
write_behavior = "read-only"
verified_read = "official"
verified_write = "not-applicable"
origin = "official"
note = "Set once the input has stayed high for the debounce interval."
[[register.field]]
id = "irqcombined"
name = "IRQCOMBINED"
lsb = 28
width = 1
api_read = "public"
write_behavior = "read-only"
verified_read = "official"
verified_write = "not-applicable"
origin = "official"
note = "OR of the eight event flags enabled by this pin's IRQMASK bits, before the interrupt override."
[[register.field]]
id = "irqtoproc"
name = "IRQTOPROC"
lsb = 29
width = 1
api_read = "public"
write_behavior = "read-only"
verified_read = "official"
verified_write = "not-applicable"
origin = "official"
note = "This pin's interrupt after the interrupt override, before the per-destination enables."

[[register]]
id = "gpio_ctrl"
name = "GPIO_CTRL"
offset = 0x4
width = 32
repeat_count = 6
repeat_stride = 8
hardware_read = "plain"
hardware_write = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "Per-pad control: function select, input filtering, interrupt event masks and signal overrides."
[register.api]
read = "public"
raw_write = "unsafe"
[register.atomic]
kind = "rp1-native"
set = "unsafe"
clear = "unsafe"
xor = "unsafe"
[[register.field]]
id = "funcsel"
name = "FUNCSEL"
lsb = 0
width = 5
api_read = "public"
write_behavior = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "Function select. 31 disconnects the pad from every function. Other values are pin-specific; for bank 0 see the pinmux matrix in this database. Values without a named function are reserved. If several pads are routed to the same peripheral input, their inputs are ORed, so normally route at most one pad to each input."
[[register.field]]
id = "f_m"
name = "F_M"
lsb = 5
width = 7
api_read = "public"
write_behavior = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "Input filter/debounce setting, counted in GPIO bank ticks. The exact mapping to a time interval, and the effect of 0, are unknown."
[[register.field]]
id = "outover"
name = "OUTOVER"
lsb = 12
width = 2
api_read = "public"
write_behavior = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "Output data override, applied to the selected function's output before the pad. 0 passes it through, 1 inverts it, 2 forces 0, 3 forces 1. Whether the pad actually drives also depends on OEOVER and the pad settings."
[[register.field]]
id = "oeover"
name = "OEOVER"
lsb = 14
width = 2
api_read = "public"
write_behavior = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "Output enable override. 0 uses the selected function's output enable, 1 inverts it, 2 forces the output off (high impedance), 3 forces it on. The pad's OD bit in PADS can still disable the output."
[[register.field]]
id = "inover"
name = "INOVER"
lsb = 16
width = 2
api_read = "public"
write_behavior = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "Input override, applied to the filtered input before it reaches the peripheral. 0 passes it through, 1 inverts it, 2 forces 0, 3 forces 1. Functions with a direct input path bypass it."
[[register.field]]
id = "irqmask_edge_low"
name = "IRQMASK_EDGE_LOW"
lsb = 20
width = 1
api_read = "public"
write_behavior = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "1 includes the raw falling-edge event in this pin's combined interrupt; 0 leaves it out."
[[register.field]]
id = "irqmask_edge_high"
