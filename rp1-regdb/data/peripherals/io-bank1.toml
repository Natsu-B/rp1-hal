[peripheral]
id = "io_bank1"
name = "IO_BANK1"
module = "io_bank1"
kind = "rp1-native-apb"
base = 0x400d4000
size = 0x1000
ownership = "singleton"
default_origin = "linux"
legacy_svd_name = "IO_BANK1_RW"
note = "RP1 IO_BANK1 register block with supplemental register semantics. Alias behavior: normal read/write access. Bank geometry and interrupt offsets are recovered from the Linux pinctrl driver; register fields are inherited from the public bank-0 layout. Unknown offsets remain split RAW arrays."

[peripheral.atomic_view]
kind = "rp1-native"
xor_offset = 0x1000
set_offset = 0x2000
clear_offset = 0x3000

[[register]]
id = "gpio_status"
name = "GPIO_STATUS"
offset = 0x0
width = 32
repeat_count = 6
repeat_stride = 8
hardware_read = "plain"
hardware_write = "none"
verified_read = "official"
verified_write = "not-applicable"
origin = "official"
note = "Per-pad status: signal values along the input and output paths, and the interrupt event detectors. Inactive flags read 0. Edge events stay set until cleared with GPIO_CTRL.IRQRESET; level events follow the current detector state."
[register.api]
read = "public"
[[register.field]]
id = "outfromperi"
name = "OUTFROMPERI"
lsb = 8
width = 1
api_read = "public"
write_behavior = "read-only"
verified_read = "official"
verified_write = "not-applicable"
origin = "official"
note = "Output data from the selected function, before the output override."
[[register.field]]
id = "outtopad"
name = "OUTTOPAD"
lsb = 9
width = 1
api_read = "public"
write_behavior = "read-only"
verified_read = "official"
verified_write = "not-applicable"
origin = "official"
note = "Output data after the output override, as sent to the pad."
[[register.field]]
id = "oefromperi"
name = "OEFROMPERI"
lsb = 12
width = 1
api_read = "public"
write_behavior = "read-only"
verified_read = "official"
verified_write = "not-applicable"
origin = "official"
note = "Output enable from the selected function, before the output enable override."
[[register.field]]
id = "oetopad"
name = "OETOPAD"
lsb = 13
width = 1
api_read = "public"
write_behavior = "read-only"
verified_read = "official"
verified_write = "not-applicable"
origin = "official"
note = "Output enable after the override, as sent to the pad. The pad's OD bit can still disable the output."
[[register.field]]
id = "inisdirect"
name = "INISDIRECT"
lsb = 16
width = 1
api_read = "public"
write_behavior = "read-only"
verified_read = "official"
verified_write = "not-applicable"
origin = "official"
note = "1 if the selected function takes the raw pad input directly, bypassing the filter and the input override (for example a clock input)."
[[register.field]]
id = "infrompad"
name = "INFROMPAD"
lsb = 17
width = 1
api_read = "public"
write_behavior = "read-only"
verified_read = "official"
verified_write = "not-applicable"
origin = "official"
note = "Input value as received from the pad input buffer, before any processing."
[[register.field]]
id = "infiltered"
name = "INFILTERED"
lsb = 18
width = 1
api_read = "public"
write_behavior = "read-only"
verified_read = "official"
verified_write = "not-applicable"
origin = "official"
note = "Input value after the filter, before the input override."
[[register.field]]
id = "intoperi"
name = "INTOPERI"
lsb = 19
width = 1
api_read = "public"
write_behavior = "read-only"
verified_read = "official"
verified_write = "not-applicable"
origin = "official"
note = "Input value after the input override, as passed to the peripheral. Direct input paths bypass it."
[[register.field]]
id = "event_edge_low"
name = "EVENT_EDGE_LOW"
lsb = 20
width = 1
api_read = "public"
write_behavior = "read-only"
verified_read = "official"
verified_write = "not-applicable"
origin = "official"
note = "Latched when the raw input falls from 1 to 0."
[[register.field]]
id = "event_edge_high"
name = "EVENT_EDGE_HIGH"
lsb = 21
width = 1
api_read = "public"
write_behavior = "read-only"
verified_read = "official"
verified_write = "not-applicable"
origin = "official"
note = "Latched when the raw input rises from 0 to 1."
[[register.field]]
id = "event_level_low"
name = "EVENT_LEVEL_LOW"
lsb = 22
width = 1
api_read = "public"
write_behavior = "read-only"
verified_read = "official"
verified_write = "not-applicable"
origin = "official"
note = "Set while the raw input is low."
[[register.field]]
id = "event_level_high"
name = "EVENT_LEVEL_HIGH"
lsb = 23
width = 1
api_read = "public"
write_behavior = "read-only"
