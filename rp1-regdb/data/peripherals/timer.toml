[peripheral]
id = "timer"
name = "TIMER"
module = "timer"
kind = "rp1-native-apb"
base = 0x400ac000
size = 0x1000
ownership = "singleton"
default_origin = "official"
legacy_svd_name = "TIMER_RW"
note = "RP1 timer block. RAW_HIGH/RAW_LOW advance at one tick per microsecond; coherent raw reads use high-low-high and retry on rollover. Write protocols are exposed only where independently verified."

[peripheral.atomic_view]
kind = "rp1-native"
xor_offset = 0x1000
set_offset = 0x2000
clear_offset = 0x3000

[[register]]
id = "timehw"
name = "TIMEHW"
offset = 0x0
width = 32
repeat_count = 1
repeat_stride = 4
hardware_read = "none"
hardware_write = "state-machine-only"
verified_read = "not-applicable"
verified_write = "hardware"
origin = "hardware"
note = "Upper half of the coordinated timer write protocol; hidden from the general PAC API."
[[register.field]]
id = "value"
name = "VALUE"
lsb = 0
width = 32
write_behavior = "plain"
verified_read = "not-applicable"
verified_write = "hardware"
origin = "hardware"
note = "Writing the high half commits it with the low half staged in TIMELW. [Evidence: HardwareProven]"

[[register]]
id = "timelw"
name = "TIMELW"
offset = 0x4
width = 32
repeat_count = 1
repeat_stride = 4
hardware_read = "none"
hardware_write = "state-machine-only"
verified_read = "not-applicable"
verified_write = "hardware"
origin = "hardware"
note = "Stages the lower half of the coordinated timer write protocol; the following TIMEHW write commits both halves. Hidden from the general PAC API."
[[register.field]]
id = "value"
name = "VALUE"
lsb = 0
width = 32
write_behavior = "plain"
verified_read = "not-applicable"
verified_write = "hardware"
origin = "hardware"
note = "Stages the writable low half without immediately changing time. [Evidence: HardwareProven]"

[[register]]
id = "timehr"
name = "TIMEHR"
offset = 0x8
width = 32
repeat_count = 1
repeat_stride = 4
hardware_read = "plain"
hardware_write = "none"
verified_read = "hardware"
verified_write = "not-applicable"
origin = "hardware"
note = "Latched high half; read after TIMELR. [Evidence: HardwareProven]"
[register.api]
read = "public"
[[register.field]]
id = "value"
name = "VALUE"
lsb = 0
width = 32
api_read = "public"
write_behavior = "read-only"
verified_read = "hardware"
verified_write = "not-applicable"
origin = "hardware"
note = "Latched high half; read after TIMELR. [Evidence: HardwareProven]"

[[register]]
id = "timelr"
name = "TIMELR"
offset = 0xc
width = 32
repeat_count = 1
repeat_stride = 4
hardware_read = "plain"
hardware_write = "none"
verified_read = "hardware"
verified_write = "not-applicable"
origin = "hardware"
note = "Low half; reading latches TIMEHR. [Evidence: HardwareProven]"
[register.api]
read = "public"
[[register.field]]
id = "value"
name = "VALUE"
lsb = 0
width = 32
api_read = "public"
write_behavior = "read-only"
verified_read = "hardware"
verified_write = "not-applicable"
origin = "hardware"
note = "Low half; reading latches TIMEHR. [Evidence: HardwareProven]"

[[register]]
id = "alarm"
name = "ALARM"
offset = 0x10
width = 32
repeat_count = 4
repeat_stride = 4
hardware_read = "plain"
hardware_write = "command"
verified_read = "hardware"
verified_write = "hardware"
origin = "hardware"
note = "Writing an alarm value arms that channel; represented as a command rather than ordinary RW state."
[register.api]
read = "public"
command = "public"
[[register.field]]
id = "value"
name = "VALUE"
lsb = 0
width = 32
api_read = "public"
api_write = "public"
write_behavior = "command"
verified_read = "hardware"
verified_write = "hardware"
origin = "hardware"
note = "Low-32-bit compare and arm register for alarm 0. [Evidence: HardwareProven]"

[[register]]
id = "armed"
name = "ARMED"
offset = 0x20
width = 32
repeat_count = 1
repeat_stride = 4
hardware_read = "plain"
hardware_write = "write-one-to-clear"
verified_read = "hardware"
verified_write = "unverified"
origin = "official"
note = "Alarm writes set ARMED and firing automatically clears it. Explicit W1C disarm is not hardware-verified and is not exposed."
[register.api]
read = "public"
raw_write = "unsafe"
[[register.field]]
id = "alarm"
name = "ALARM"
lsb = 0
width = 4
api_read = "public"
write_behavior = "write-one-to-clear"
verified_write = "unverified"

