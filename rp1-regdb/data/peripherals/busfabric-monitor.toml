[peripheral]
id = "busfabric_monitor"
name = "BUSFABRIC_MONITOR"
module = "busfabric_monitor"
kind = "rp1-native-apb"
base = 0x400c0000
size = 0x1000
ownership = "singleton"
default_origin = "official"
legacy_svd_name = "BUSFABRIC_MONITOR_RW"
note = "Monitoring window for the bus fabric. The individual measurement controls are not known. APB bus. Plain read/write at the base; XOR, SET and CLEAR aliases at +0x1000, +0x2000 and +0x3000."

[peripheral.atomic_view]
kind = "rp1-native"
xor_offset = 0x1000
set_offset = 0x2000
clear_offset = 0x3000
