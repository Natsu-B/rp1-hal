[peripheral]
id = "pwm0"
name = "PWM0"
module = "pwm0"
kind = "rp1-native-apb"
base = 0x40098000
size = 0x1000
ownership = "singleton"
default_origin = "official"
legacy_svd_name = "PWM0_RW"
note = "PWM block with four waveform channels. Waveforms run on `clk_pwm`; the register bus runs on `clk_sys`. Bus=APB. Atomic aliases: XOR at +0x1000, SET at +0x2000, CLR at +0x3000."

[peripheral.atomic_view]
kind = "rp1-native"
xor_offset = 0x1000
set_offset = 0x2000
clear_offset = 0x3000

[[register]]
id = "global_ctrl"
name = "GLOBAL_CTRL"
offset = 0x0
width = 32
repeat_count = 1
repeat_stride = 4
hardware_read = "plain"
hardware_write = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
reset_value = 0x0
note = "Staged enables for the four channels, plus the trigger for a synchronized update of the waveform engine. Because `set_update` clears itself, the PAC offers no general modify and no safe writer for it; the enables keep their typed SET/CLR/XOR writers."
[register.api]
read = "public"
raw_write = "unsafe"
[register.atomic]
kind = "rp1-native"
set = "typed"
clear = "typed"
xor = "typed"
[[register.field]]
id = "chan0_en"
name = "CHAN0_EN"
lsb = 0
width = 1
api_read = "public"
api_write = "public"
write_behavior = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "Channel 0 enable: 0 off, 1 on in its configured mode. Takes effect via `set_update`."
[[register.field]]
id = "chan1_en"
name = "CHAN1_EN"
lsb = 1
width = 1
api_read = "public"
api_write = "public"
write_behavior = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "Channel 1 enable: 0 off, 1 on in its configured mode. Takes effect via `set_update`."
[[register.field]]
id = "chan2_en"
name = "CHAN2_EN"
lsb = 2
width = 1
api_read = "public"
api_write = "public"
write_behavior = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "Channel 2 enable: 0 off, 1 on in its configured mode. Takes effect via `set_update`."
[[register.field]]
id = "chan3_en"
name = "CHAN3_EN"
lsb = 3
width = 1
api_read = "public"
api_write = "public"
write_behavior = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "Channel 3 enable: 0 off, 1 on in its configured mode. Takes effect via `set_update`."
[[register.field]]
id = "set_update"
name = "SET_UPDATE"
lsb = 31
width = 1
api_read = "public"
write_behavior = "self-clearing"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "Write 1 to apply the staged enables, channel control and phase, and `common_range`. Hardware clears the bit. Local range and duty writes do not need it; they apply at the channel's rollover."

[[register]]
id = "fifo_ctrl"
name = "FIFO_CTRL"
offset = 0x4
width = 32
repeat_count = 1
repeat_stride = 4
hardware_read = "plain"
hardware_write = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "FIFO level, flush and DMA request control. The registers are in the `clk_sys` domain; FIFO consumption and flush completion happen in `clk_pwm`."
[register.api]
read = "public"
modify = "public"
raw_write = "unsafe"
[register.atomic]
kind = "rp1-native"
set = "typed"
clear = "typed"
xor = "typed"
[[register.field]]
id = "level"
name = "LEVEL"
lsb = 0
width = 5
api_read = "public"
write_behavior = "read-only"
verified_read = "official"
verified_write = "not-applicable"
origin = "official"
note = "Number of words in the FIFO. How it counts when several channels are packed into one entry is unknown."
[[register.field]]
id = "flush"
name = "FLUSH"
lsb = 5
width = 1
api_read = "public"
api_write = "public"
write_behavior = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "Write 1 to request that queued duty samples be discarded. Wait for `flush_done`, since completion crosses clock domains. Whether this bit clears itself is unknown."
[[register.field]]
id = "flush_done"
name = "FLUSH_DONE"
lsb = 6
width = 1
api_read = "public"
write_behavior = "read-only"
verified_read = "official"
verified_write = "not-applicable"
origin = "official"
note = "1 when the PWM clock domain has finished the flush."
[[register.field]]
id = "threshold"
name = "THRESHOLD"
lsb = 11
width = 5
api_read = "public"
api_write = "public"
write_behavior = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "A DMA request is raised while `level` is at or below this value. Same units as `level`."
[[register.field]]
id = "dwell_time"
name = "DWELL_TIME"
lsb = 16
width = 5
api_read = "public"
api_write = "public"
write_behavior = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "Minimum gap between DMA requests in bus cycles, giving in-flight writes time to reach the FIFO."
[[register.field]]
id = "dreq_en"
name = "DREQ_EN"
lsb = 31
width = 1
api_read = "public"
api_write = "public"
write_behavior = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "1 enables the DMA request output. 0 masks it, but the `dreq_active` interrupt source still works."

[[register]]
id = "common_range"
name = "COMMON_RANGE"
offset = 0x8
width = 32
repeat_count = 1
repeat_stride = 4
hardware_read = "plain"
hardware_write = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
reset_value = 0x0
note = "Shared counter limit for channels with `bind=1`. Applied by `global_ctrl.set_update`."
[register.api]
read = "public"
modify = "public"
raw_write = "unsafe"
[register.atomic]
kind = "rp1-native"
set = "typed"
clear = "typed"
xor = "typed"
[[register.field]]
id = "range"
name = "RANGE"
lsb = 0
width = 32
api_read = "public"
api_write = "public"
write_behavior = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "Shared counter limit in PWM clock counts; replaces the local range for bound channels."

[[register]]
id = "common_duty"
name = "COMMON_DUTY"
offset = 0xc
width = 32
repeat_count = 1
repeat_stride = 4
hardware_read = "plain"
hardware_write = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
reset_value = 0x0
note = "Shared duty value for bound channels that take duty from a register."
[register.api]
read = "public"
modify = "public"
raw_write = "unsafe"
[register.atomic]
kind = "rp1-native"
set = "typed"
clear = "typed"
xor = "typed"
[[register.field]]
id = "duty"
name = "DUTY"
lsb = 0
width = 32
api_read = "public"
api_write = "public"
write_behavior = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "Shared value whose meaning follows `mode`: compare value, pulse position, density numerator or serial word. Used when `bind=1` and `usefifo=0`."

[[register]]
id = "duty_fifo"
name = "DUTY_FIFO"
offset = 0x10
width = 32
repeat_count = 1
repeat_stride = 4
hardware_read = "none"
hardware_write = "fifo"
verified_read = "not-applicable"
verified_write = "official"
origin = "official"
reset_value = 0x0
note = "Write-only FIFO input. Each 32-bit write fills one of up to four lanes of a 128-bit entry, rotating through the channels that use the FIFO. One packed entry holds one word per participating channel."
[[register.field]]
id = "value"
name = "VALUE"
lsb = 0
width = 32
write_behavior = "plain"
verified_read = "not-applicable"
verified_write = "official"
origin = "official"
note = "One 32-bit duty sample. The channel it goes to follows the lane rotation."

[[register]]
id = "chan0_ctrl"
name = "CHAN0_CTRL"
offset = 0x14
width = 32
repeat_count = 1
repeat_stride = 4
hardware_read = "plain"
hardware_write = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "Waveform setup for channel 0. Changes take effect after a `global_ctrl.set_update` write."
[register.api]
read = "public"
modify = "public"
raw_write = "unsafe"
[register.atomic]
kind = "rp1-native"
set = "typed"
clear = "typed"
xor = "typed"
[[register.field]]
id = "mode"
name = "MODE"
lsb = 0
width = 3
api_read = "public"
api_write = "public"
write_behavior = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "Waveform mode. 0: output 0 (before inversion). 1: trailing-edge PWM, counter counts up. 2: centre-aligned pulse, counter counts down then up. 3: pulse density, high for DUTY/RANGE of the steps; each step adds DUTY to an accumulator, and when the sum reaches RANGE a 1 is output and RANGE is subtracted. 4: serial output starting at bit 31. 5: one high slot when COUNT equals DUTY. 6: leading-edge PWM, counter counts down. 7: serial output starting at bit 0. Modes 1, 2 and 6 output high while COUNT < DUTY. Serial modes wrap the bit index modulo 32."
[[register.field]]
id = "invert"
name = "INVERT"
lsb = 3
width = 1
api_read = "public"
api_write = "public"
write_behavior = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "1 inverts the output after mode processing; 0 leaves it unchanged."
[[register.field]]
id = "bind"
name = "BIND"
lsb = 4
width = 1
api_read = "public"
api_write = "public"
write_behavior = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "0 uses this channel's own range and duty registers. 1 uses `common_range`, with duty from `common_duty` or the FIFO."
[[register.field]]
id = "usefifo"
name = "USEFIFO"
lsb = 5
width = 1
api_read = "public"
api_write = "public"
write_behavior = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "0 takes duty from a register; 1 takes duty from the FIFO. Needs `bind=1`; using the FIFO without bind gives unpredictable results."
[[register.field]]
id = "sdm"
name = "SDM"
lsb = 6
width = 1
api_read = "public"
api_write = "public"
write_behavior = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "1 enables second-order sigma-delta noise shaping: the duty value is treated as signed 16-bit and quantized to `sdm_bitwidth`+1 bits, advancing on the channel's duty strobe. 0 bypasses shaping."
[[register.field]]
id = "dither"
name = "DITHER"
lsb = 7
width = 1
api_read = "public"
api_write = "public"
write_behavior = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "1 adds a one-LSB dither into the sigma-delta loop to break up idle tones; 0 turns it off. Only has an effect when `sdm=1`."
[[register.field]]
id = "fifo_pop_mask"
name = "FIFO_POP_MASK"
lsb = 8
width = 1
api_read = "public"
api_write = "public"
write_behavior = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "1 lets this channel's rollover contribute to the shared FIFO pop (an OR across bound channels). 0 keeps its rollover from popping."
[[register.field]]
id = "sdm_bitwidth"
name = "SDM_BITWIDTH"
lsb = 12
width = 4
api_read = "public"
api_write = "public"
write_behavior = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "Sigma-delta output precision minus one: values 0-15 give 1-16 bits."
[[register.field]]
id = "sdm_bias"
name = "SDM_BIAS"
lsb = 16
width = 16
api_read = "public"
api_write = "public"
write_behavior = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "Unsigned offset added to the quantized PWM code, for example to move a signed source into an unsigned range."

