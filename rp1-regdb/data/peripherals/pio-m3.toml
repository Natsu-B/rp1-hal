[peripheral]
id = "pio_m3"
name = "PIO_M3"
module = "pio_m3"
kind = "memory-mapped"
base = 0xf0000000
size = 0x16c
ownership = "singleton"
view_of = "pio"
default_origin = "reverse-engineered"
reset_dependency = "RESETS CTRL0 PIO_APBS"
clock_dependency = "clk_sys"
pinmux_dependency = "Bank 0 FUNCSEL 7"
note = "STATIC: M3 control window (MichaelBell/rp1-hacking PIO.md and stock firmware register accesses). FIFO views share the APB window's owner."

[[register]]
id = "ctrl"
name = "CTRL"
offset = 0x00
width = 32
hardware_read = "plain"
hardware_write = "command"
verified_read = "static"
verified_write = "static"
note = "SM enable and restart commands."
[register.api]
read = "public"
raw_write = "unsafe"

[[register]]
id = "fstat"
name = "FSTAT"
offset = 0x04
width = 32
hardware_read = "plain"
hardware_write = "none"
verified_read = "static"
verified_write = "not-applicable"
[register.api]
read = "public"

[[register]]
id = "fdebug"
name = "FDEBUG"
offset = 0x08
width = 32
hardware_read = "plain"
hardware_write = "write-one-to-clear"
verified_read = "static"
verified_write = "unverified"
[register.api]
read = "public"

[[register]]
id = "flevel"
name = "FLEVEL"
offset = 0x0c
width = 32
hardware_read = "plain"
hardware_write = "none"
verified_read = "static"
verified_write = "not-applicable"
note = "Level 15 also represents 16 when joined."
[register.api]
read = "public"

[[register]]
