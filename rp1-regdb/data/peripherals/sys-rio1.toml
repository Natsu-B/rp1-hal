default_origin = "linux"
legacy_svd_name = "SYS_RIO1_RW"
note = "RP1 SYS_RIO1 register block with supplemental register semantics. Alias behavior: normal read/write access. Bank geometry is recovered from the Linux pinctrl driver; register fields are inherited from the public bank-0 layout. Unknown offsets remain split RAW arrays."

