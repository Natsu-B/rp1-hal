[peripheral]
id = "eth_cfg"
name = "ETH_CFG"
module = "eth_cfg"
kind = "rp1-native-apb"
base = 0x40104000
size = 0x1000
ownership = "singleton"
default_origin = "official"
legacy_svd_name = "ETH_CFG_RW"
note = "RP1 glue logic around the GEM Ethernet MAC: timestamp unit, RGMII clocking and interrupt routing. Bus=APB. Atomic aliases: normal at base, XOR at +0x1000, SET at +0x2000, CLR at +0x3000."

[peripheral.atomic_view]
kind = "rp1-native"
xor_offset = 0x1000
set_offset = 0x2000
clear_offset = 0x3000

[[register]]
id = "control"
name = "CONTROL"
offset = 0x0
width = 32
repeat_count = 1
repeat_stride = 4
hardware_read = "plain"
hardware_write = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
reset_value = 0x0
note = "MAC glue controls for the timestamp unit, bus error reporting and memory power."
[register.api]
read = "public"
modify = "public"
raw_write = "unsafe"
[register.atomic]
kind = "rp1-native"
set = "typed"
clear = "typed"
xor = "typed"
[[register.field]]
id = "tsu_ms"
name = "TSU_MS"
lsb = 0
width = 1
api_read = "public"
api_write = "public"
write_behavior = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "Drives the GEM timestamp unit master/slave select input. Which level means master is not known."
[[register.field]]
id = "tsu_inc_ctrl"
name = "TSU_INC_CTRL"
lsb = 1
width = 2
api_read = "public"
api_write = "public"
write_behavior = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "2-bit value driven to the GEM timestamp increment control input. Code meanings are not known."
[[register.field]]
id = "buserr_en"
name = "BUSERR_EN"
lsb = 3
width = 1
api_read = "public"
api_write = "public"
write_behavior = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "1 passes GEM bus errors on to the fabric; 0 suppresses them. With this set, accesses to unused MAC address space can raise bus faults."
[[register.field]]
id = "mem_pd"
name = "MEM_PD"
lsb = 4
width = 1
api_read = "public"
api_write = "public"
write_behavior = "plain"
verified_read = "official"
verified_write = "official"
origin = "official"
note = "1 requests memory power-down; 0 keeps memory powered. Content retention and wake-up sequence are not known."

